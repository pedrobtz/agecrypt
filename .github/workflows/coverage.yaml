on:
  push:
    branches: [main, master]
  pull_request:

name: coverage.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit rather than @v1: this is the one call holding a
    # write token (it commits the coverage badge).
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@59c917ddee2cd0191f8f015016c4c76c4f2a8c87 # v1.18.0
    permissions:
      contents: write
    with:
      # main only takes changes through pull requests, so the badge commit
      # goes to gh-pages, which already takes the pkgdown deploy's pushes.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
